name: Alarme de pautas GTA 6

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'normal, teste ou marcar'
        default: 'normal'

permissions:
  contents: write

concurrency:
  group: alarme
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ler canais, cruzar temas e avisar
        env:
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODO: ${{ github.event.inputs.modo }}
        run: |
          case "$MODO" in
            teste) node alarme.js --teste ;;
            marcar) node alarme.js --marcar ;;
            *) node alarme.js ;;
          esac
      - name: Pagina do celular (Bombando agora + Faz agora)
        if: always()
        run: node pagina-celular.js || true
      - name: Guardar o que ja viu e avisou
        if: always()
        run: |
          git config user.name "alarme"
          git config user.email "alarme@users.noreply.github.com"
          for f in itens.json temas.json avisadas.json pedidos.json docs/index.html; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "pautas" && git pull --rebase -q && git push)
