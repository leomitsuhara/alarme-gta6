name: Alarme GTA 6

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'normal ou teste'
        default: 'normal'

permissions:
  contents: write

concurrency:
  group: alarme
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ler feeds e avisar
        env:
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          MODO: ${{ github.event.inputs.modo }}
        run: |
          if [ "$MODO" = "teste" ]; then
            node alarme.js --teste
          else
            node alarme.js
          fi
      - name: Guardar o que ja avisou
        if: always()
        run: |
          git config user.name "alarme"
          git config user.email "alarme@users.noreply.github.com"
          git add vistos.json
          git diff --cached --quiet || (git commit -m "vistos" && git push)
